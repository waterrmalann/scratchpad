[package]
name = "scratchpad"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
scratchpad-core.workspace = true
scratchpad-editor.workspace = true
chrono.workspace = true
dirs.workspace = true
gpui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# Embeds the icon and version info (build.rs). Chosen over writing `.rc` files by hand because it
# fills the version resource from Cargo's package metadata; it is compile-time only.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

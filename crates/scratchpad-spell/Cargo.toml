[package]
name = "scratchpad-spell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flume.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true

# The Windows Spell Checking API (Windows 8 and later). GPUI depends on the same version of
# `windows`, so these features add bindings, not crates.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Globalization", "Win32_System_Com"] }

# Hunspell dictionaries, read in pure Rust: no C library to build or ship (ADR 0170).
[target.'cfg(not(windows))'.dependencies]
spellbook.workspace = true

# The Hunspell backend's tests run everywhere, on a small dictionary of their own.
[dev-dependencies]
spellbook.workspace = true

[lints]
workspace = true

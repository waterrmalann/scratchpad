[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
scratchpad-core = { path = "crates/scratchpad-core" }
scratchpad-editor = { path = "crates/scratchpad-editor" }

chrono = { version = "0.4", default-features = false, features = ["clock"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
dirs = "7"
notify = "8"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
trash = "5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

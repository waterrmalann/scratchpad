[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
scratchpad-core = { path = "crates/scratchpad-core" }
scratchpad-editor = { path = "crates/scratchpad-editor" }

chrono = { version = "0.4", default-features = false, features = ["clock"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
dirs = "7"
gpui = "0.2.2"
notify = "8"
proptest = "1"
pulldown-cmark = { version = "0.13.4", default-features = false }
# Line breaks are normalized to LF on load (ADR 0003), so ropey only needs to recognise LF.
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std", "tracing-log"] }
trash = "5"
unicode-segmentation = "1.13"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies (GPUI above all) are optimised even in dev builds so a debug app renders
# and responds at a usable speed. They rarely change, so this costs one slower first build;
# our own crates stay at opt-level 0 for fast incremental rebuilds. See ADR 0021.
[profile.dev.package."*"]
opt-level = 2

# Small, fast shipping binary. See ADR 0021.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
